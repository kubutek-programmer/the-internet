:{"videoId":"P31Xm28ZJ3U","title":{"runs":[{"text":"3D Zelda Challenge Speedrun in 6:41:34","navigationEndpoint":{"clickTrackingParams":"CJYBEIlRGAAiEwiYtYnQgsaWAxX8O_EFHT8sBXDKAQQlWjHy","commandMetadata":{"webCommandMetadata":{"url":"/watch?v=P31Xm28ZJ3U","webPageType":"WEB_PAGE_TYPE_WATCH","rootVe":3832}},"watchEndpoint":{"videoId":"P31Xm28ZJ3U","watchEndpointSupportedOnesieConfig":{"html5PlaybackOnesieConfig":{"commonConfig":{"url":"https://rr4---sn-aj2gb5-5j.googlevideo.com/initplayback?source=youtube\u0026oeis=1\u0026c=WEB\u0026oad=3200\u0026ovd=3200\u0026oaad=11000\u0026oavd=11000\u0026ocs=700\u0026oewis=1\u0026oputc=1\u0026olis=1\u0026ofpcc=1\u0026msp=1\u0026odepv=1\u0026id=3f7d579b6f192775\u0026ip=2a02%3Aa312%3Ac9a5%3A6780%3A75b6%3Abbaa%3Abc43%3A91d4\u0026initcwndbps=3013750\u0026mt=1788012301\u0026oweuc="}}}}}}],"accessibility":{"accessibilityData":{"label":"3D Zelda Challenge Speedrun in 6:41:34 6 godzin i 59 minut"}}},"description":{"runs":[{"text":"I finally got a run that I feel fairly satisfied with! TP was unfortunately sloppy and I lost a few minutes, but the challenge run itself was pretty solid apart from that.\n\nThe 3D Zelda Challenge consists of an Any% speedrun of each main 3D Zelda game. The games in this challenge are the original versions of Ocarina of Time, Majora's Mask, The Wind Waker, Twilight Princess, Skyward Sword and Breath of the Wild. \n\nThe final times for each speedrun (and when the runs start in the video):\n"},{"text":"0:00"},{"text":" | OoT: "},{"text":"9:06"},{"text":"\n"},{"text":"9:28"},{"text":" | MM: "},{"text":"26:17"},{"text":"\n"},{"text":"35:52"},{"text":" | TWW: "},{"text":"1:01:11"},{"text":"\n"},{"text":"1:37:20"},{"text":" | BotW: "},{"text":"31:02"},{"text":"\n"},{"text":"2:09:05"},{"text":" | SS: "},{"text":"1:28:46"},{"text":"\n"},{"text":"3:39:15"},{"text":" | TP: "},{"text":"3:02:28"},{"text":"\n\nTime without setups: 6 38 52\n\nA small description for each run will be provided below.\nOoT: Fastest completed by using Arbitrary Code Execution (ACE). While this speedrun might not seem like the most enjoyable speedrun, it is still the fastest way to complete it. If you are interested in how it exactly works there is a thorough explanation in the description of Danny's former WR video ("},{"text":"https://www.youtube.com/watch?v=UA8xt...","navigationEndpoint":{"clickTrackingParams":"CJYBEIlRGAAiEwiYtYnQgsaWAxX8O_EFHT8sBXDKAQQlWjHy","commandMetadata":{"webCommandMetadata":{"url":"/watch?v=UA8xtN2QXCg","webPageType":"WEB_PAGE_TYPE_WATCH","rootVe":3832}},"watchEndpoint":{"videoId":"UA8xtN2QXCg","startTimeSeconds":0,"watchEndpointSupportedOnesieConfig":{"html5PlaybackOnesieConfig":{"commonConfig":{"url":"https://rr2---sn-ajf5f5-5p.googlevideo.com/initplayback?source=youtube\u0026oeis=1\u0026c=WEB\u0026oad=3200\u0026ovd=3200\u0026oaad=11000\u0026oavd=11000\u0026ocs=700\u0026oewis=1\u0026oputc=1\u0026olis=1\u0026ofpcc=1\u0026msp=1\u0026odepv=1\u0026id=500f31b4dd905c28\u0026ip=2a02%3Aa312%3Ac9a5%3A6780%3A75b6%3Abbaa%3Abc43%3A91d4\u0026initcwndbps=3590000\u0026mt=1788012301\u0026oweuc="}}}}}},{"text":").\n\nMM: Also uses ACE but must first complete the first cycle to transform to human. A specific filename must be used along with another filename must be inserted into file 2 during the run to make the setup work. I do however not have an in depth explanation of this one.\n\nTWW: Starts out with doing a what we call manual superswim. This involves turning back and forth every frame to gradually build backwards momentum and then swim to Dragon Roost to get the Wind Waker. Once we have the Wind Waker we can do a glitch called \"storage\". Storage allows for several things; we can lock our camera in front of Link to simply do the previously mentioned superswim by just holding upwards, we can store chests to reduce our hitbox, store different cutscenes and more. A way past the barrier in Hyrule was found last year which also allows us to skip most of the game and proceed to the endgame.\n\nTP: While TP is broken in itself there are many sequences which cannot be skipped, making it the longest game in this challenge. A general glitch which is used through the speedrun is the so called \"Long Jump Attack\", or LJA in short. If you throw the boomerang over a void, or have it be over a platform which is positioned ABOVE Link and then jumpattack, you will fly much further than normal. If you are interested in the potential of sequence breaks in TP take a look at Gymnast86's video ("},{"text":"https://www.youtube.com/watch?v=d5LHi...","navigationEndpoint":{"clickTrackingParams":"CJYBEIlRGAAiEwiYtYnQgsaWAxX8O_EFHT8sBXDKAQQlWjHy","commandMetadata":{"webCommandMetadata":{"url":"/watch?v=d5LHiV6awv4","webPageType":"WEB_PAGE_TYPE_WATCH","rootVe":3832}},"watchEndpoint":{"videoId":"d5LHiV6awv4","startTimeSeconds":0,"watchEndpointSupportedOnesieConfig":{"html5PlaybackOnesieConfig":{"commonConfig":{"url":"https://rr5---sn-2gb7snez.googlevideo.com/initplayback?source=youtube\u0026oeis=1\u0026c=WEB\u0026oad=3200\u0026ovd=3200\u0026oaad=11000\u0026oavd=11000\u0026ocs=700\u0026oewis=1\u0026oputc=1\u0026olis=1\u0026ofpcc=1\u0026msp=1\u0026odepv=1\u0026id=7792c7895e9ac2fe\u0026ip=2a02%3Aa312%3Ac9a5%3A6780%3A75b6%3Abbaa%3Abc43%3A91d4\u0026initcwndbps=3006250\u0026mt=1788012301\u0026oweuc="}}}}}},{"text":").\n\nSS: Skyward Sword makes use of a glitch called Back in Time (BiT) and uses it through most of the run. BiT is performed by dying, continuing the game and reseting your console at the same time. If done right it will put you on the title screen in a playable state. During BiT it is possible to do several different things. As an example; you can \"BiTWarp\" which is performed by saving the game during BiT and starting your savefile at the same time. This will put you in the area which your savefile was saved in, but at different coordinates depending on which statue you use in BiT. There is also \"Reverse BiTMagic\" (RBM) which is performed by triggering a flag in BiT and starting the savefile at the right timing. This will bring this achieved flag over FROM BiT TO your actual savefile and its saved area. An example of this used in the run is pushing the gravestone in BiT Skyloft. If your savefile is saved in Eldin this flag will correspond to the flag for the Earth Temple door being opened, allowing us to just enter without grabbing the key parts.\n\nBotW: As Breath of the Wild allows you to go for the final boss instantly it is exactly what we do. We skip the tower on the plateau and instead clip inside of the shrines due to it being faster. All shrines on the plateau must be completed to get the paraglider, and the paraglider is a must to leave the plateau. Once at the castle we need to stock up on weapons and an attack potion to later kill the blights and calamity. During the run we make use of different types of launches; Bullet-time Bounces (BtB), Windbombs/Bomb Impact Launch (BIL) and regular stasis launches. If you wonder over how these are performed there are several videos on them here on YouTube!\n\nFollow me on Twitch for live speedruns: "},{"text":"https://twitch.tv/demon","navigationEndpoint":{"clickTrackingParams":"CJYBEIlRGAAiEwiYtYnQgsaWAxX8O_EFHT8sBXDKAQQlWjHy","commandMetadata":{"webCommandMetadata":{"url":"https://www.youtube.com/redirect?event=video_description\u0026redir_token=QUM4Zm9rU0g3cndsc2xjRnF5QnJibTdxMkZOY3xBTl9pYzRjRjBYc1B2N3hMb0luY1BJNGJUamhGN1oxRlFrUVNXUlZXakVYckZrUVhhQ0RSSDZZZVNUVXNFLW81M1BOeWJnUG9TMnhFWks1VXpodEd0RFI0LVlJdTlQRFkwUGtU\u0026q=https%3A%2F%2Ftwitch.tv%2Fdemon","webPageType":"WEB_PAGE_TYPE_UNKNOWN","rootVe":83769}},"urlEndpoint":{"url":"https://www.youtube.com/redirect?event=video_description\u0026redir_token=QUM4Zm9rU0g3cndsc2xjRnF5QnJibTdxMkZOY3xBTl9pYzRjRjBYc1B2N3hMb0luY1BJNGJUamhGN1oxRlFrUVNXUlZXakVYckZrUVhhQ0RSSDZZZVNUVXNFLW81M1BOeWJnUG9TMnhFWks1VXpodEd0RFI0LVlJdTlQRFkwUGtU\u0026q=https%3A%2F%2Ftwitch.tv%2Fdemon","target":"TARGET_NEW_WINDOW","nofollow":true}}},{"text":"\n..
